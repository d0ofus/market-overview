name = "market-command-worker"
main = "src/index.ts"
compatibility_date = "2025-01-15"

[vars]
APP_TIMEZONE = "Australia/Melbourne"
DATA_PROVIDER = "alpaca"
ALPACA_FEED = "iex"
ALPACA_LIVE_FEED = "iex"
ALPACA_DAILY_FEED = "sip"
ALPACA_DAILY_ADJUSTMENT = "split"
OVERVIEW_CURRENT_V2_ENABLED = "true"
OVERVIEW_PUBLICATION_RECOVERY_ENABLED = "true"
MARKET_DATA_DB_REQUIRED = "true"
OPS_DB_REQUIRED = "true"
MARKET_PIPELINE_MODE = "canary"
MARKET_DATA_RETENTION_DAYS = "460"
MARKET_DATA_DAILY_WRITE_BUDGET = "90000"
MARKET_DATA_CRITICAL_WRITE_RESERVE = "20000"
MARKET_DATA_DAILY_READ_BUDGET = "4500000"
MARKET_DATA_CRITICAL_READ_RESERVE = "500000"
MARKET_DATA_WARN_BYTES = "350000000"
MARKET_DATA_CRITICAL_BYTES = "400000000"
MARKET_DATA_HALT_BYTES = "425000000"
CORE_DB_WARN_BYTES = "350000000"
CORE_DB_CRITICAL_BYTES = "425000000"
CORE_DB_HALT_BYTES = "450000000"
OPS_DB_WARN_BYTES = "100000000"
ALPACA_REQUESTS_PER_MINUTE_WARN = "150"
ALPACA_REQUESTS_PER_MINUTE_HARD = "160"
YAHOO_REQUESTS_PER_DAY_HARD = "250"
SCHEDULED_MARKET_DATA_BUDGET = "70"
SCHEDULED_MAINTENANCE_BUDGET = "34"
RS_STATE_V2_DUAL_WRITE_ENABLED = "false"
RS_STATE_V2_READ_ENABLED = "false"
RS_LEGACY_CACHE_WRITE_ENABLED = "true"
TRADINGVIEW_WIDGET_ENABLED = "true"
ALERTS_RECONCILE_ENABLED = "false"
ALERTS_ENABLE_YFINANCE_FALLBACK = "true"
ALERTS_EMAIL_ALLOWED_FROM = "tradingview.com"
IBKR_NEWS_ENABLED = "false"
IBKR_OPTIONS_ENABLED = "true"
IBKR_OPTIONS_TIMEOUT_MS = "30000"
IBKR_OPTIONS_STALE_SECONDS = "900"
OPTIONS_SNAPSHOT_RETENTION_DAYS = "7"
OPTIONS_REFRESH_TICKER_LIMIT = "50"
OPTIONS_HISTORICAL_SPREAD_MAX_CONTRACTS = "40"
OPTIONS_HISTORICAL_SPREAD_SAMPLE_TARGET = "300"
GEMINI_MODEL = "gemini-3.5-flash"
GEMINI_COMMENTARY_FALLBACK_MODEL = "gemini-3.1-flash-lite"
GEMINI_SEARCH_GROUNDING_ENABLED = "false"
MARKET_COMMENTARY_GEMINI_TIMEOUT_MS = "90000"
MARKET_COMMENTARY_RETENTION_DAYS = "30"
WEEKLY_MARKET_REVIEW_SCHEDULE_TIMEZONE = "Australia/Melbourne"
WEEKLY_MARKET_REVIEW_SCHEDULE_DAY = "Saturday"
WEEKLY_MARKET_REVIEW_SCHEDULE_TIME = "11:00"
WEEKLY_MARKET_REVIEW_HERMES_GRACE_MINUTES = "180"
MARKET_OVERVIEW_PUBLIC_URL = "https://market-overview-nu.vercel.app"
SCANNER_CACHE_QUEUE_ENABLED = "false"
SCANNER_CACHE_BATCHING_ENABLED = "false"
SCANNER_CACHE_BATCH_SIZE = "10"

[[queues.producers]]
binding = "SCANNER_CACHE_SCAN_QUEUE"
queue = "scanner-cache-scan-runs"

[[queues.consumers]]
queue = "scanner-cache-scan-runs"
dead_letter_queue = "scanner-cache-scan-runs-dlq"
max_retries = 5
max_batch_size = 1

[[d1_databases]]
binding = "DB"
database_name = "market_command"
database_id = "30528f34-b249-4d93-9b18-1d60a36df85d"

[[d1_databases]]
binding = "MARKET_DATA_DB"
database_name = "market_prices"
database_id = "a6dedc93-6ffc-4793-9b3d-0ef47e29c4b8"
migrations_dir = "market-data-migrations"

[[d1_databases]]
binding = "OPS_DB"
database_name = "market_ops"
database_id = "15725d67-5914-43ae-a149-c160ea4e09bd"
migrations_dir = "ops-migrations"

[[d1_databases]]
binding = "SCANNER_CACHE_DB"
database_name = "market_rs"
database_id = "6837481f-3dd3-4f7c-933d-7927b5c755cd"
migrations_dir = "scanner-cache-migrations"

[[d1_databases]]
binding = "FUNDAMENTALS_DB"
database_name = "market_fundamentals"
database_id = "3380987f-47a5-4ffe-8593-30d9f6b9ffbe"

[[d1_databases]]
binding = "PATTERN_DB"
database_name = "market_patterns"
database_id = "979ab7bb-8c24-4978-b07a-66914d92ac04"

[[d1_databases]]
binding = "PERPLEXITY_CACHE_DB"
database_name = "market_perplexity_cache"
database_id = "efc8828b-6a94-41bd-9f7d-f3b6ece191c4"

[triggers]
crons = [
  "*/15 * * * *",
  "*/5 * * * *",
  "11,26,41,56 * * * *",
]
