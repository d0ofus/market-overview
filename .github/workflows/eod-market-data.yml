name: EOD market data
run-name: EOD ${{ inputs.run_id }}
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Durable Cloudflare EOD run ID
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: market-eod-writer
  cancel-in-progress: false
jobs:
  eod:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 80
    environment: market-eod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Run the resumable daily pipeline
        run: npm run eod:run -w worker
        env:
          EOD_RUN_ID: ${{ inputs.run_id }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EOD_CORE_DATABASE_ID: ${{ vars.EOD_CORE_DATABASE_ID }}
          EOD_MARKET_DATABASE_ID: ${{ vars.EOD_MARKET_DATABASE_ID }}
          EOD_OPS_DATABASE_ID: ${{ vars.EOD_OPS_DATABASE_ID }}
          EOD_HISTORY_DATABASE_ID: ${{ vars.EOD_HISTORY_DATABASE_ID }}
          CLOUDFLARE_EOD_D1_TOKEN: ${{ secrets.CLOUDFLARE_EOD_D1_TOKEN }}
          CLOUDFLARE_EOD_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_EOD_ANALYTICS_TOKEN }}
          EOD_ARCHIVE_PRUNE_ENABLED: ${{ vars.EOD_ARCHIVE_PRUNE_ENABLED }}
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_API_SECRET: ${{ secrets.ALPACA_API_SECRET }}
