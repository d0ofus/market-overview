name: EOD operating evidence
on:
  schedule:
    - cron: "35 0 * * *"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: market-eod-writer
  cancel-in-progress: false
jobs:
  monitor:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: market-eod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Record daily operating evidence
        run: npx tsx worker/scripts/eod-monitor-runner.ts
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          EOD_MARKET_DATABASE_ID: ${{ vars.EOD_MARKET_DATABASE_ID }}
          EOD_OPS_DATABASE_ID: ${{ vars.EOD_OPS_DATABASE_ID }}
          EOD_HISTORY_DATABASE_ID: ${{ vars.EOD_HISTORY_DATABASE_ID }}
          EOD_STORAGE_CODE_REVISION: ${{ vars.EOD_STORAGE_CODE_REVISION }}
          EOD_RUNNER_MODE: ${{ vars.EOD_RUNNER_MODE || 'shadow' }}
          CLOUDFLARE_EOD_D1_TOKEN: ${{ secrets.CLOUDFLARE_EOD_D1_TOKEN }}
          CLOUDFLARE_EOD_ANALYTICS_TOKEN: ${{ secrets.CLOUDFLARE_EOD_ANALYTICS_TOKEN }}
